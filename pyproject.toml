[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax"
version = "1.0.0"
description = "PARALLAX — Autonomous Human-Intelligence Trading System (Indian index + crypto)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["parallax*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
